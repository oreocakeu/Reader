<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--sf:#fffdf8;--fg:#262220;--mut:#857b6c;--acc:#a8452a;--hl:#f3e2b366;--ln:#2622201a;--fs:20px;--ff:'Newsreader',Georgia,serif}
[data-t=sepia]{--bg:#efe4cb;--sf:#f6edd6;--fg:#3d2f20;--mut:#8a765c;--acc:#9a4a22;--hl:#e3c98a66;--ln:#3d2f2022}
[data-t=dark]{--bg:#121110;--sf:#1c1a17;--fg:#e8e2d6;--mut:#948b7a;--acc:#e58a5e;--hl:#e58a5e26;--ln:#ffffff18}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 Inter,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;transition:background .3s,color .3s}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none;transition:background .15s}
.ib:hover{background:var(--ln)}
header{display:flex;align-items:center;gap:6px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--ln)}
#ttl{flex:1;min-width:0;text-align:center;font:600 17px Newsreader,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ch{appearance:none;background:none;border:0;max-width:34vw;color:var(--mut);font-size:13px;text-align:right;text-overflow:ellipsis;cursor:pointer}
#aa{font:600 17px Newsreader,Georgia,serif}
main{flex:1;overflow-y:auto;padding:36px 22px 28px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#pg{max-width:34em;margin:auto;font:400 var(--fs)/1.8 var(--ff);hyphens:auto}
#pg p{margin:0 0 1.05em;padding:2px 10px;margin-left:-10px;margin-right:-10px;border-radius:8px;cursor:pointer;transition:background .25s,box-shadow .25s}
#pg p.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--acc)}
#home{max-width:880px;margin:0 auto;padding-top:3vh}
.hero{text-align:center;padding:4vh 0 5vh}
.logo{width:54px;height:54px;border-radius:16px;background:var(--acc);color:#fff;display:grid;place-items:center;margin:0 auto 18px}
.logo .i{width:28px;height:28px}
h1{font:600 clamp(30px,6vw,44px)/1.1 Newsreader,Georgia,serif;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--mut);max-width:30rem;margin:0 auto 22px}
.big{display:inline-flex;gap:10px;align-items:center;background:var(--acc);color:#fff;padding:13px 26px;border-radius:999px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px -8px var(--acc);transition:transform .15s}
.big:hover{transform:translateY(-1px)}
.hint{color:var(--mut);font-size:13px;margin-top:14px}
h2{font:600 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 14px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:20px 16px}
.card{cursor:pointer}
.cover{position:relative;aspect-ratio:2/3;border-radius:6px 12px 12px 6px;padding:16px 12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px -10px #0008,inset 4px 0 0 #0003;transition:transform .2s}
.card:hover .cover{transform:translateY(-4px)}
.cover span{font:600 16px/1.25 Newsreader,Georgia,serif;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.cover em{font:500 11px Inter;letter-spacing:.1em;opacity:.7;font-style:normal}
.cover button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:#0005;color:#fff;font-size:16px;line-height:1;opacity:0;transition:opacity .15s}
.card:hover .cover button,.cover button:focus{opacity:1}
@media(hover:none){.cover button{opacity:.8}}
.bar{height:3px;background:var(--ln);border-radius:3px;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
small{color:var(--mut);font-size:12px}
.empty{color:var(--mut);grid-column:1/-1;text-align:center;padding:24px;border:1px dashed var(--ln);border-radius:16px}
footer{width:min(720px,calc(100% - 20px));margin:0 auto max(10px,env(safe-area-inset-bottom));background:var(--sf);border:1px solid var(--ln);border-radius:24px;box-shadow:0 12px 40px -12px #0004;padding:10px 12px 12px;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:6px}
#sl{flex:1;accent-color:var(--acc);height:4px}
.meta{text-align:center;color:var(--mut);font-size:12.5px}
#gp{width:52px;text-align:center;background:transparent;border:0;border-bottom:1px solid var(--ln);color:var(--fg);font-weight:600;padding:1px}
#gp::-webkit-inner-spin-button{display:none}
.ctl{justify-content:space-between}
#pl{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -8px var(--acc);transition:transform .15s}
#pl:active{transform:scale(.94)}#pl .i{width:26px;height:26px}
select.pill{appearance:none;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;min-width:0;text-overflow:ellipsis}
#rt{width:64px;text-align:center}#vo{flex:1;max-width:38%}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#scrim{position:fixed;inset:0;background:#0006;z-index:4;backdrop-filter:blur(2px)}
#panel{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:480px;background:var(--sf);border-radius:24px 24px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom));z-index:5;display:grid;gap:18px;box-shadow:0 -10px 50px #0005}
#panel h3{margin:0;font:600 18px Newsreader,Georgia,serif}
#panel label{display:grid;gap:8px;color:var(--mut);font-size:13px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--ln);border-radius:14px;padding:12px 6px;font-size:13px;display:grid;gap:6px;justify-items:center}
.seg button i{width:26px;height:26px;border-radius:50%;border:1px solid var(--ln)}
.seg button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
#fs{accent-color:var(--acc)}
#cl{background:var(--fg);color:var(--bg);border-radius:14px;padding:13px;font-weight:600}
#toast{position:fixed;top:max(64px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:9;max-width:90vw;text-align:center;font-size:13.5px;box-shadow:0 10px 30px #0005}
input[type=file]{display:none}
@media(max-width:480px){main{padding:26px 18px 20px}}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#sl{min-width:0}#home{max-width:1100px}
@media(min-width:1000px){main{padding-top:52px}#cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:28px 22px}footer{width:min(760px,calc(100% - 40px))}header{padding-left:24px;padding-right:24px}}
@media(max-width:480px){#cards{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 12px}.hero{padding:2vh 0 4vh}.cover span{font-size:14px}}
@media(max-width:480px){.ctl{gap:2px}.ctl .ib{width:36px;height:36px}#rt{width:54px;padding:8px 4px}#vo{flex:1;max-width:none;padding:8px 10px}#ch{max-width:26vw}footer{gap:2px;padding:6px 8px 8px}#pl{width:52px;height:52px}#sl{margin:0}.meta{font-size:12px}#pp,#np{width:34px;height:34px}}
#panel select{color:var(--fg)}footer{grid-template-columns:minmax(0,1fr)}.row{min-width:0}.empty{margin:0}
@media(min-width:700px){#panel{bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px}}
@media(max-height:520px){footer{grid-template-columns:1fr auto;align-items:center;padding:6px 12px}.meta{display:none}#pl{width:44px;height:44px}#vo{flex:none;width:150px;max-width:none}main{padding:16px 18px}.hero{padding:0 0 3vh}.logo{display:none}}
@media(pointer:coarse){select.pill,#gp,#ch,#ff{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}main{scroll-behavior:auto}}
@media(max-height:520px){footer{grid-template-columns:minmax(0,1fr) auto}}
</style>
</head>
<body>
<header>
  <button class="ib" id="hm" title="Library"><svg class="i" viewBox="0 0 24 24"><path d="M4 4.5h4.5v15H4zM10.5 4.5H15v15h-4.5zM17 6.3l4-1 3 13.4-4 1z"/></svg></button>
  <span id="ttl">My Reader</span>
  <select id="ch" hidden title="Contents"></select><button class="ib" id="aa" hidden title="Reading settings">Aa</button>
</header>
<main id="book">
  <section id="home">
    <div class="hero">
      <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5v13c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5z"/><path d="M12 6v13"/></svg></div>
      <h1>Read it. Or listen to it.</h1>
      <p class="sub">Open any EPUB, PDF, Word or text file as clean, numbered pages — and have it read aloud in a natural voice.</p>
      <label class="big"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg> Open a book<input id="f" type="file" accept=".epub,.pdf,.docx,.txt,.md"></label>
      <div class="hint">or drop a file anywhere · everything stays on your device</div>
    </div>
    <h2>Your library</h2><div id="cards"></div>
  </section>
  <article id="pg" hidden></article>
</main>
<footer id="ft" hidden>
  <div class="row"><button class="ib" id="pp" title="Previous page"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><input id="sl" type="range" min="0" value="0"><button class="ib" id="np" title="Next page"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
  <div class="meta">Page <input id="gp" type="number" min="1"> <span id="tot"></span></div>
  <div class="row ctl">
    <select class="pill" id="rt" title="Speed"><option>0.8</option><option>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select>
    <button class="ib" id="pv" title="Previous paragraph"><svg class="i" viewBox="0 0 24 24"><path d="M19 5l-7 7 7 7M11 5l-7 7 7 7"/></svg></button>
    <button id="pl" title="Play / pause"></button>
    <button class="ib" id="nx" title="Next paragraph"><svg class="i" viewBox="0 0 24 24"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg></button>
    <select class="pill" id="vo" title="Voice"></select>
  </div>
</footer>
<div id="scrim" hidden></div>
<div id="panel" hidden>
  <h3>Reading settings</h3>
  <div class="seg"><button data-th="light"><i style="background:#f7f3ea"></i>Light</button><button data-th="sepia"><i style="background:#efe4cb"></i>Sepia</button><button data-th="dark"><i style="background:#121110"></i>Dark</button></div>
  <label>Text size <input id="fs" type="range" min="14" max="34" step="1"></label>
  <label>Typeface <select class="pill" id="ff"><option value="serif">Serif — Newsreader</option><option value="sans">Sans — Inter</option></select></label>
  <button id="cl">Done</button>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
const $=id=>document.getElementById(id),S=speechSynthesis,LIM=1500;
let P=[],pgs=[],toc=[],cur=0,pg=0,playing=false,tk=0,aud,K,id='';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const st=Object.assign({fs:innerWidth<480?18:innerWidth>1300?22:20,t:'light',f:'serif',rate:'1',voice:'k:af_heart'},ld('set',{}));
const apply=()=>{const b=document.body;b.dataset.t=st.t;b.style.setProperty('--fs',st.fs+'px');b.style.setProperty('--ff',st.f=='serif'?"'Newsreader',Georgia,serif":"Inter,system-ui,sans-serif");localStorage.set=JSON.stringify(st);$('fs').value=st.fs;$('ff').value=st.f;$('rt').value=st.rate;document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th==st.t))};
function msg(t,ms=2500){const e=$('toast');e.textContent=t;e.hidden=!t;clearTimeout(msg.t);if(ms)msg.t=setTimeout(()=>e.hidden=true,ms)}
const chunks=(t,n)=>{const r=t.match(/[^.!?]+[.!?]*["”']?\s*/g)||[t],o=[];let c='';r.forEach(s=>{if((c+s).length>n&&c){o.push(c.trim());c=''}c+=s});c.trim()&&o.push(c.trim());return o};

const IC={'▶':'<svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>','⏸':'<svg class="i" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/></svg>','⏳':'<svg class="i spin" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg>'};
const pl=x=>$('pl').innerHTML=IC[x];
/* ---------- storage: parsed books cached in IndexedDB (instant reopen) ---------- */
const db=new Promise((ok,no)=>{const r=indexedDB.open('reader2',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const q=f(d.transaction('b',m).objectStore('b'));q.onsuccess=()=>ok(q.result);q.onerror=no})};

/* ---------- parsers ---------- */
const clean=s=>s.replace(/\s+/g,' ').trim(),norm=p=>{const o=[];p.split('/').forEach(x=>x=='..'?o.pop():x!='.'&&o.push(x));return o.join('/')};
async function readEpub(buf){
  const z=await JSZip.loadAsync(buf),xml=s=>new DOMParser().parseFromString(s,'application/xml');
  const rd=p=>{const f=z.file(p)||z.file(decodeURIComponent(p));return f?f.async('string'):null};
  const op=xml(await rd('META-INF/container.xml')).querySelector('rootfile').getAttribute('full-path');
  const opf=xml(await rd(op)),base=op.replace(/[^/]*$/,''),man={},out=[];
  opf.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));
  for(const r of opf.querySelectorAll('spine > itemref')){
    const h=man[r.getAttribute('idref')];if(!h)continue;const src=await rd(norm(base+h.split('#')[0]));if(!src)continue;
    const d=new DOMParser().parseFromString(src,'text/html');
    const paras=[...d.body.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li')].map(e=>clean(e.textContent)).filter(Boolean);
    if(paras.length){const t=d.body.querySelector('h1,h2,h3');out.push({title:t?clean(t.textContent).slice(0,60):'Section '+(out.length+1),paras})}
  }return out}
async function readDocx(buf){
  const {value}=await mammoth.convertToHtml({arrayBuffer:buf}),d=new DOMParser().parseFromString(value,'text/html'),out=[];
  let c={title:'Start',paras:[]};
  [...d.body.children].forEach(e=>{const t=clean(e.textContent);if(!t)return;
    if(/^H[12]$/.test(e.tagName)){c.paras.length&&out.push(c);c={title:t.slice(0,60),paras:[]}}else c.paras.push(t)});
  c.paras.length&&out.push(c);return out}
async function readPdf(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf}).promise,out=[],N=10;
  for(let a=1;a<=pdf.numPages;a+=N){
    let raw='';const e=Math.min(a+N-1,pdf.numPages);
    for(let p=a;p<=e;p++){msg(`Reading page ${p} of ${pdf.numPages}…`,0);
      raw+=(await (await pdf.getPage(p)).getTextContent()).items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('')+'\n'}
    raw=raw.replace(/(\w)-\n(\w)/g,'$1$2');const paras=[];let c='';
    raw.split('\n').map(clean).forEach(l=>{if(!l){c&&paras.push(c);c='';return}c=c?c+' '+l:l;if(/[.!?:”"]$/.test(l)&&c.length>350){paras.push(c);c=''}});
    c&&paras.push(c);paras.length&&out.push({title:`Pages ${a}–${e}`,paras})}
  return out}
function readTxt(s){const ps=s.split(/\n\s*\n/).map(clean).filter(Boolean),o=[];for(let i=0;i<ps.length;i+=40)o.push({title:'Part '+(i/40+1),paras:ps.slice(i,i+40)});return o}

/* ---------- pages ---------- */
function build(ch){P=[];pgs=[];toc=[];
  ch.forEach(c=>{toc.push({t:c.title,pg:pgs.length});let a=P.length,n=0;
    const fl=()=>{if(P.length>a){pgs.push([a,P.length]);a=P.length;n=0}};
    c.paras.forEach(t=>chunks(t,LIM).forEach(x=>{if(n+x.length>LIM)fl();P.push(x);n+=x.length}));fl()});
  $('ch').innerHTML='';toc.forEach((t,i)=>$('ch').add(new Option(t.t,i)));
  $('sl').max=pgs.length-1;$('gp').max=pgs.length;$('tot').textContent='of '+pgs.length}
function show(p){pg=Math.max(0,Math.min(pgs.length-1,p));const[a,b]=pgs[pg];
  $('pg').replaceChildren(...P.slice(a,b).map((t,i)=>{const e=document.createElement('p');e.textContent=t;e.dataset.g=a+i;return e}));
  $('book').scrollTop=0;$('sl').value=pg;$('gp').value=pg+1;$('ch').value=toc.reduce((r,t,i)=>t.pg<=pg?i:r,0)}
function hl(){document.querySelector('#pg p.on')?.classList.remove('on');const e=document.querySelector(`#pg p[data-g="${cur}"]`);
  if(e){e.classList.add('on');if(playing)e.scrollIntoView({block:'center',behavior:'smooth'})}}
function go(g){cur=Math.max(0,Math.min(P.length-1,g));const p=pgs.findIndex(x=>cur<x[1]);if(p!==pg)show(p);hl();localStorage.setItem('pos:'+id,cur)}
function jump(p){show(p);cur=pgs[pg][0];hl();localStorage.setItem('pos:'+id,cur);playing&&play(cur)}

/* ---------- open / library ---------- */
function openBook(key,rec){stop();id=key;build(rec.ch);$('ttl').textContent=rec.name.replace(/\.[^.]+$/,'');
  ['home'].forEach(x=>$(x).hidden=true);['pg','ft','ch','aa'].forEach(x=>$(x).hidden=false);
  show(0);go(+localStorage.getItem('pos:'+key)||0);document.querySelector('#pg p.on')?.scrollIntoView({block:'center'})}
async function load(f){
  try{msg('Opening…',0);const ext=f.name.split('.').pop().toLowerCase();let ch;
    if(ext=='epub')ch=await readEpub(await f.arrayBuffer());else if(ext=='docx')ch=await readDocx(await f.arrayBuffer());
    else if(ext=='pdf')ch=await readPdf(await f.arrayBuffer());else ch=readTxt(await f.text());
    if(!ch.length)throw Error('no readable text (scanned PDFs need OCR)');
    const key='bk:'+f.name+f.size,rec={name:f.name,ch};build(ch);rec.n=P.length;
    await tx('readwrite',s=>s.put(rec,key));msg('');openBook(key,rec)}
  catch(e){msg('Could not open: '+e.message,5000)}}
async function home(){stop();id='';['pg','ft','ch','aa'].forEach(x=>$(x).hidden=true);$('home').hidden=false;$('ttl').textContent='My Reader';
  const keys=await tx('readonly',s=>s.getAllKeys()),vals=await tx('readonly',s=>s.getAll());$('cards').replaceChildren();
  if(!vals.length)$('cards').innerHTML='<p class="empty">Books you open are saved here, so you can pick up right where you left off.</p>';
  vals.forEach((v,i)=>{const pct=Math.round(100*(+localStorage.getItem('pos:'+keys[i])||0)/(v.n||1)),nm=v.name.replace(/\.[^.]+$/,'');let h=0;for(const k of nm)h=(h*31+k.charCodeAt(0))%360;
    const c=document.createElement('div');c.className='card';c.innerHTML='<div class="cover"><span></span><em></em><button title="Remove">×</button></div><div class="bar"><i></i></div><small></small>';
    const cv=c.querySelector('.cover');cv.style.background=`linear-gradient(150deg,hsl(${h} 38% 36%),hsl(${(h+45)%360} 45% 20%))`;
    c.querySelector('span').textContent=nm;c.querySelector('em').textContent=v.name.split('.').pop().toUpperCase();c.querySelector('i').style.width=pct+'%';c.querySelector('small').textContent=pct+'% read';
    c.onclick=async e=>{if(e.target.tagName=='BUTTON'){e.stopPropagation();if(confirm('Remove this book from your library?')){await tx('readwrite',s=>s.delete(keys[i]));home()}}else openBook(keys[i],v)};$('cards').append(c)})}
$('f').onchange=e=>{e.target.files[0]&&load(e.target.files[0]);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])});
$('hm').onclick=home;

/* ---------- listening ---------- */
const A=new Audio(),SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
async function getK(){if(K)return K;msg('Loading natural voice…',0);
  try{let mod,err;for(const u of['https://cdn.jsdelivr.net/npm/kokoro-js@1/+esm','https://esm.sh/kokoro-js@1']){try{mod=await import(u);break}catch(e){err=e}}
    if(!mod)throw err;
    K=await mod.KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX',{dtype:'q8',device:'wasm',
      progress_callback:p=>{if(p.status=='progress')msg('Downloading voice… '+Math.round(p.progress)+'% (first time only)',0)}});
    msg('Voice ready ✓');return K}
  catch(e){msg('Natural voice failed: '+(e.message||e)+' — using device voice.',8000);
    const o=[...$('vo').options].find(x=>x.value&&!x.value.startsWith('k:'));st.voice=o?o.value:'';$('vo').value=st.voice;apply()}}
function stop(){tk++;playing=false;S.cancel();const a=aud;aud=null;if(a){a.pause();a.onended&&a.onended()}pl('▶')}
async function play(from=cur){
  stop();const my=tk;playing=true;pl('⏸');go(from);
  let v=st.voice,nat=v.startsWith('k:'),tts;
  if(nat){pl('⏳');tts=await getK();if(my!==tk)return;pl('⏸');if(!tts){if(!st.voice.startsWith('k:'))return play(from);return stop()}}
  let chain=Promise.resolve();const gen=t=>{const p=chain.then(()=>tts.generate(t,{voice:v.slice(2)}));chain=p.catch(()=>{});return p.then(a=>URL.createObjectURL(a.toBlob()))};
  function*units(){for(let g=cur;g<P.length;g++){const ps=chunks(P[g],240);for(let k=0;k<ps.length;k++)yield{g,t:ps[k],f:!k}}}
  const it=units(),q=[],fill=()=>{while(q.length<(nat?3:1)){const n=it.next();if(n.done)break;q.push({...n.value,u:nat?gen(n.value.t):0})}};
  fill();
  while(q.length){const x=q.shift();if(my!==tk)return;fill();if(x.f)go(x.g);
    if(nat){let url;try{url=await x.u}catch(e){msg('Voice error: '+(e.message||e),4000);continue}if(my!==tk)return;
      await new Promise(r=>{aud=A;A.onended=r;A.onerror=()=>{msg('Audio error');r()};A.src=url;A.playbackRate=+st.rate;A.play().catch(e=>{msg('Sound blocked: '+e.name+'. Tap ▶ again.',5000);stop();r()})});URL.revokeObjectURL(url)}
    else await new Promise(r=>{const u=new SpeechSynthesisUtterance(x.t),d=S.getVoices().find(y=>y.voiceURI==v);
      if(d){u.voice=d;u.lang=d.lang}u.rate=+st.rate;u.onend=r;u.onerror=e=>{if(!/cancel|interrupt/.test(e.error))msg('Voice error: '+e.error,4000);r()};S.speak(u)})}
  if(my===tk)stop()}
$('pl').onclick=()=>{if(playing)return stop();A.src=SIL;A.play().catch(()=>{});play()};
$('nx').onclick=()=>{go(cur+1);playing&&play(cur)};$('pv').onclick=()=>{go(cur-1);playing&&play(cur)};
$('np').onclick=()=>jump(pg+1);$('pp').onclick=()=>jump(pg-1);
$('sl').oninput=()=>$('gp').value=+$('sl').value+1;$('sl').onchange=()=>jump(+$('sl').value);
$('gp').onchange=()=>jump((+$('gp').value||1)-1);$('ch').onchange=()=>jump(toc[+$('ch').value].pg);
$('pg').onclick=e=>{const p=e.target.closest('p');if(p){cur=+p.dataset.g;hl();localStorage.setItem('pos:'+id,cur);playing&&play(cur)}};
$('rt').onchange=()=>{st.rate=$('rt').value;apply();if(aud)aud.playbackRate=+st.rate;else if(playing)play(cur)};
let x0;$('book').addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
$('book').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(id&&Math.abs(d)>90)jump(pg+(d<0?1:-1))},{passive:true});
addEventListener('keydown',e=>{if(!id||/INPUT|SELECT/.test(e.target.tagName))return;
  if(e.key=='ArrowRight')jump(pg+1);else if(e.key=='ArrowLeft')jump(pg-1);else if(e.key==' '){e.preventDefault();$('pl').click()}});

/* ---------- settings ---------- */
const NAT=[['af_heart','Heart — US woman'],['af_bella','Bella — US woman'],['am_michael','Michael — US man'],['am_fenrir','Fenrir — US man'],['bf_emma','Emma — UK woman'],['bm_george','George — UK man']];
function voices(){const vs=S.getVoices(),good=v=>/natural|neural|online|enhanced|premium|google/i.test(v.name);
  vs.sort((a,b)=>good(b)-good(a));
  $('vo').innerHTML='<optgroup label="✨ Natural AI voices (recommended)">'+NAT.map(([i,n])=>`<option value="k:${i}">${n}</option>`).join('')+'</optgroup><optgroup label="Device voices"><option value="">Default device voice</option>'+vs.map(v=>`<option value="${v.voiceURI}">${good(v)?'★ ':''}${v.name} (${v.lang})</option>`).join('')+'</optgroup>';
  $('vo').value=st.voice}
voices();S.onvoiceschanged=voices;
$('vo').onchange=()=>{st.voice=$('vo').value;apply();playing&&play(cur)};
$('fs').oninput=()=>{st.fs=+$('fs').value;apply()};$('ff').onchange=()=>{st.f=$('ff').value;apply()};
document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{st.t=b.dataset.th;apply()});
const sheet=v=>$('panel').hidden=$('scrim').hidden=!v;$('aa').onclick=()=>sheet(true);$('cl').onclick=$('scrim').onclick=()=>sheet(false);
pl('▶');apply();navigator.storage?.persist?.();home();
</script>
